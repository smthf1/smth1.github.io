<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Checkpoint</title>
    <style>
        body {
            /* Deep space background with a dark overlay to maintain readability */
            background-color: #050505;
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f41?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: rgba(26, 26, 26, 0.85); /* Slightly transparent to show space behind it */
            padding: 40px;
            border-radius: 8px;
            border: 1px solid #ff5500;
            box-shadow: 0 0 20px rgba(255, 85, 0, 0.3);
            width: 350px;
            backdrop-filter: blur(5px);
        }
        h2 {
            color: #ff5500;
            text-shadow: 0 0 10px rgba(255, 85, 0, 0.6);
            margin-top: 0;
            letter-spacing: 1px;
        }
        .task-btn {
            display: block;
            width: 100%;
            background-color: rgba(42, 42, 42, 0.9);
            color: white;
            border: 1px solid #ff5500;
            padding: 12px 0;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin: 15px 0;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(255, 85, 0, 0.2);
        }
        .task-btn:hover {
            background-color: #ff5500;
            color: #121212;
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.8);
        }
        .task-btn.completed {
            background-color: rgba(51, 51, 51, 0.8);
            border-color: #555;
            color: #888;
            cursor: default;
            box-shadow: none;
            pointer-events: none;
        }
        #generate-btn {
            background-color: #333;
            color: #555;
            border: none;
            padding: 15px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: not-allowed;
            margin-top: 20px;
            width: 100%;
            transition: all 0.3s ease;
        }
        #generate-btn.unlocked {
            background-color: #ff5500;
            color: #121212;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.8);
        }
        #generate-btn.unlocked:hover {
            background-color: #ff7733;
        }
        .status {
            font-size: 14px;
            color: #ccc;
            margin-top: 15px;
            min-height: 20px;
            font-weight: bold;
        }
        .timer {
            font-size: 28px;
            color: #ff5500;
            margin-top: 10px;
            font-family: monospace;
            display: none;
            text-shadow: 0 0 10px rgba(255, 85, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>System Verification</h2>
        <p>Complete the security checks below to unlock the generation protocol.</p>
        
        <a href="https://www.youtube.com/@c00lk1ddck" target="_blank" class="task-btn" id="yt-btn" onclick="completeTask('yt')">Subscribe to YouTube</a>
        <a href="https://discord.com/invite/P2TXsmxnRc" target="_blank" class="task-btn" id="dc-btn" onclick="completeTask('dc')">Join Discord Server</a>
        
        <div class="status" id="status-text">Awaiting task completion...</div>
        <div class="timer" id="countdown-timer">60</div>

        <button id="generate-btn" disabled onclick="window.location.href='page2.html'">Initialize Key Generation</button>
    </div>

    <script>
        let ytCompleted = false;
        let dcCompleted = false;
        let isChecking = false;

        function completeTask(task) {
            if (task === 'yt') {
                const ytBtn = document.getElementById('yt-btn');
                ytBtn.classList.add('completed');
                ytBtn.innerText = "YouTube Verified";
                ytCompleted = true;
            }
            if (task === 'dc') {
                const dcBtn = document.getElementById('dc-btn');
                dcBtn.classList.add('completed');
                dcBtn.innerText = "Discord Verified";
                dcCompleted = true;
            }

            if (ytCompleted && dcCompleted && !isChecking) {
                isChecking = true;
                startVerificationTimer();
            }
        }

        function startVerificationTimer() {
            let timeLeft = 60;
            const statusText = document.getElementById('status-text');
            const timerDisplay = document.getElementById('countdown-timer');
            const generateBtn = document.getElementById('generate-btn');

            statusText.innerText = "Bypassing security protocols... Do not close.";
            statusText.style.color = "#ff5500";
            timerDisplay.style.display = "block";
            timerDisplay.innerText = timeLeft;

            const timer = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    statusText.innerText = "Bypass complete. System unlocked.";
                    statusText.style.color = "#00ff00"; 
                    timerDisplay.style.display = "none";
                    
                    generateBtn.removeAttribute("disabled");
                    generateBtn.classList.add('unlocked');
                }
            }, 1000); 
        }
    </script>
</body>
</html>
